<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gizoogle (Local)</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Gizoogle</h1>
      <p class="sub">Local page filter</p>

      <label class="row" for="enabled">
        <span>Enabled</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label class="row" for="level">
        <span>Snoopiness</span>
        <input id="level" type="range" min="1" max="3" step="1" />
      </label>
      <p id="levelLabel" class="level-label"></p>

      <p id="hint" class="hint"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
